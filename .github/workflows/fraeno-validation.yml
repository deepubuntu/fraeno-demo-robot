name: Fraeno fixed public demo

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fraeno-public-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demonstrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out the fixed Fraeno demonstrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepubuntu/fraeno-demo
          ref: c389c5e699246af7b38c1dfff47dd7c8c140a554
          path: demo-engine
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: demo-engine/pyproject.toml

      - name: Install the fixed demonstrator
        run: python -m pip install ./demo-engine

      - name: Show the fixed pass or block outcome
        run: >-
          fraeno-demo compare
          --baseline "$PWD/baseline"
          --candidate "$PWD/candidate"
          --output "$PWD/fraeno-demo-report.json"

      - name: Upload the demonstration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraeno-fixed-demo-report
          path: fraeno-demo-report.json
          if-no-files-found: warn
          retention-days: 7
